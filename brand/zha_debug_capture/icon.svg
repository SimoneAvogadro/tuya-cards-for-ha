  <rect x="52" y="88"  width="100" height="10" rx="5" fill="#CFD8DC"/>
  <rect x="52" y="110" width="116" height="10" rx="5" fill="#CFD8DC"/>
  <rect x="52" y="132" width="84"  height="10" rx="5" fill="#CFD8DC"/>
  <rect x="52" y="154" width="108" height="10" rx="5" fill="#CFD8DC"/>
