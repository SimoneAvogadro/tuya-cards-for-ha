irrigation_by_seconds:
  name: Irrigation By Seconds
  description: >-
    Open the given valve, wait N seconds, then close it. The timer runs server-side
    inside Home Assistant, so it works regardless of the valve firmware's own auto-off
    behaviour (useful for devices such as the Tuya _TZE200_a7sghmms whose native
    duration timer is unreliable under ZHA).
  fields:
    switch_entity:
      name: Valve
      description: The switch entity that controls the irrigation valve.
      required: true
      selector:
        entity:
          domain: switch
    seconds:
      name: Seconds
      description: How long to keep the valve open, in seconds.
      required: true
      example: 60
      selector:
        number:
          min: 1
          max: 43200
          unit_of_measurement: s
          mode: box

irrigation_by_liters:
  name: Irrigation By Liters
  description: >-
    Open the given valve, monitor the device's _summation_delivered sensor, and
    close the valve when the configured volume has been delivered. Two safety
    nets bound a run that never reaches its target: a stall watchdog closes the
    valve if no water is measured for ~5 minutes, and an adaptive cap tightens
    the maximum runtime toward the measured flow rate (never beyond the safety
    timeout below).
  fields:
    switch_entity:
      name: Valve
      description: The switch entity that controls the irrigation valve.
      required: true
      selector:
        entity:
          domain: switch
    liters:
      name: Liters
      description: Target volume to deliver, in liters.
      required: true
      example: 10
      selector:
        number:
          min: 1
          max: 10000
          unit_of_measurement: L
          mode: box
    timeout_seconds:
      name: Safety timeout (max run time)
      description: >-
        Maximum time the valve may stay open before it is forcibly closed,
        whether or not the target volume is reached. The adaptive cap only
        tightens this downward — closing sooner when the sampled flow rate says
        the run should already be done — never later. A stalled flow still
        closes the valve within ~5 minutes regardless. Defaults to 3600 (1 hour).
      required: false
      default: 3600
      selector:
        number:
          min: 60
          max: 86400
          unit_of_measurement: s
          mode: box
