# Field metadata for the irrigation services. Names/descriptions live in
# strings.json + translations/, keyed by the same service and field names;
# this file only carries the selectors the frontend renders. Keeping the labels
# out of here is what makes them translatable — inline names in this file are
# shown verbatim in every language.
#
# The valve is picked as a standard HA service TARGET. Declaring `target:` (not
# a plain `device_id` field) is what makes these services show up in the
# automation editor's "by target" tab when a valve device is selected: the
# frontend asks `get_services_for_target`, which lists every service whose
# target entity filter matches one of the device's entities — here this
# integration's own entities on the valve (the "Irrigating" binary_sensor), so
# exactly the detected valves match. Device actions cannot do this since HA
# 2026.8: they are only asked of the device's owning integration (ZHA), never
# of an integration that merely attaches entities to the device.
#
# The same filters drive the target picker: `device` lists the devices carrying
# this integration's entities, `entity` offers the "Irrigating" binary_sensor
# of each valve. A target must resolve to ONE valve (the service rejects more).
# `switch_entity` is still accepted by the service schema for the card and
# existing automations, but is not offered in the UI.
irrigation_by_seconds:
  target:
    device:
      - integration: tuya_irrigation
    entity:
      - integration: tuya_irrigation
        domain: binary_sensor
  fields:
    seconds:
      required: true
      example: 60
      selector:
        number:
          min: 1
          max: 43200
          unit_of_measurement: s
          mode: box

irrigation_by_liters:
  target:
    device:
      - integration: tuya_irrigation
    entity:
      - integration: tuya_irrigation
        domain: binary_sensor
  fields:
    liters:
      required: true
      example: 10
      selector:
        number:
          min: 1
          max: 10000
          unit_of_measurement: L
          mode: box
    # Collapsed section: the safety timeout is rarely changed, and its
    # explanation was the bulk of the form on a phone. Section name/field
    # strings live in strings.json (`sections` / `fields`).
    advanced:
      collapsed: true
      fields:
        timeout_seconds:
          required: false
          default: 3600
          selector:
            number:
              min: 60
              max: 86400
              unit_of_measurement: s
              mode: box
