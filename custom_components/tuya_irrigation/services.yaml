# Field metadata for the irrigation services. Names/descriptions live in
# strings.json + translations/, keyed by the same service and field names;
# this file only carries the selectors the frontend renders. Keeping the labels
# out of here is what makes them translatable — inline names in this file are
# shown verbatim in every language.
irrigation_by_seconds:
  fields:
    switch_entity:
      required: true
      selector:
        entity:
          domain: switch
    seconds:
      required: true
      example: 60
      selector:
        number:
          min: 1
          max: 43200
          unit_of_measurement: s
          mode: box

irrigation_by_liters:
  fields:
    switch_entity:
      required: true
      selector:
        entity:
          domain: switch
    liters:
      required: true
      example: 10
      selector:
        number:
          min: 1
          max: 10000
          unit_of_measurement: L
          mode: box
    timeout_seconds:
      required: false
      default: 3600
      selector:
        number:
          min: 60
          max: 86400
          unit_of_measurement: s
          mode: box
